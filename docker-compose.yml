version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: espace_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-espace_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: espace_redis
    restart: always
    ports:
      - "6379:6379"

  backend-wsgi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: espace_backend_wsgi
    restart: always
    # Зміни 'myproject' на реальну назву папки конфігу твого Django
    command: gunicorn myproject.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./backend:/app
      - django_static:/app/static
      - django_media:/app/media
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-espace_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  backend-asgi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: espace_backend_asgi
    restart: always
    # Зміни 'myproject' на реальну назву папки конфігу твого Django
    command: daphne -b 0.0.0.0 -p 8001 myproject.asgi:application
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-espace_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: espace_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro  # Передаємо згенерований білд Vue
      - django_static:/app/static:ro              # Монтуємо статику джанго (адмінка тощо)
      - django_media:/app/media:ro                # Монтуємо завантажені медіа-файли
    depends_on:
      - backend-wsgi
      - backend-asgi

volumes:
  postgres_data:
  django_static:
  django_media: