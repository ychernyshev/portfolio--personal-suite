version: '3.8'

services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: espace_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-espace_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: docker.io/library/redis:alpine
    container_name: espace_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: espace_backend_dev
    command: daphne -b 0.0.0.0 -p 8001 settings.asgi:application
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-espace_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data: